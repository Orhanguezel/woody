# woody — woodyvearkadaslari.com (DOGRUDAN A kaydi, gercek Let's Encrypt SSL)
# Frontend kokte; admin /admin + /auth altinda (assetPrefix=/admin-assets ile /_next cakismasi yok)
#
# Bu dosya sunucuya elle uygulanan /etc/nginx/sites-available/woody.conf'un versiyonlanmis kopyasidir.
# 443/SSL satirlarini `certbot --nginx -d woodyvearkadaslari.com -d www.woodyvearkadaslari.com --redirect`
# otomatik ekler; asagidaki port-80 blogu certbot calismadan onceki halidir.
#
# TUZAK (KESIN): gercek TLS'te nginx HTTPS'i sonlandirip ic servise HTTP proxy'ler.
#   Frontend `/` ve admin location'larinda X-Forwarded-Proto MUTLAKA `http` olmali —
#   `$scheme` (=https) verilirse proxy.ts kok `/`→`/tr` internal rewrite'i Next'in kendi
#   HTTP portuna https ile baglanmaya calisip 500 doner. /api ve /uploads `https` kalabilir
#   (backend Fastify trustProxy ile dogru calisir, internal rewrite yok).

server {
  listen 80;
  listen [::]:80;
  server_name www.woodyvearkadaslari.com;
  return 301 https://woodyvearkadaslari.com$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.woodyvearkadaslari.com;

  ssl_certificate /etc/letsencrypt/live/woodyvearkadaslari.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/woodyvearkadaslari.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://woodyvearkadaslari.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name woodyvearkadaslari.com;

  client_max_body_size 25m;

  # API + uploads -> backend (8101)  [gercek scheme: https]
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:8101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  # Uploads — diskten DOGRUDAN (backend rate-limit 429 tuzagi: statik dosya API kotasina girmesin)
  location ^~ /uploads/ {
    alias /var/www/woody/backend/uploads/;
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # Buyuk medya (video/ses/gorsel) — diskten DOGRUDAN, Next bypass.
  # ZORUNLU: proxy.ts /media/*.mp4'u /tr/...'ye rewrite edip 404 verir; bu blok Next'i atlatir.
  # (git/rsync disi; deploy/fetch-media.sh ile public/media/ altina indirilir)
  location ^~ /media/ {
    alias /var/www/woody/frontend/public/media/;
    try_files $uri =404;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Google site dogrulama dosyalari (google<hash>.html) — diskten DOGRUDAN, Next bypass.
  # ZORUNLU: proxy.ts i18n matcher kok disindaki her yolu /tr/...'ye rewrite edip 404 verir;
  # bu blok dogrulama dosyasini Next'i atlatip public/'ten servis eder.
  location ~* ^/google[a-z0-9]+\.html$ {
    root /var/www/woody/frontend/public;
    try_files $uri =404;
    access_log off;
    default_type text/html;
  }

  # Admin statik asset'leri: /admin-assets/_next/... -> admin (prefix soyulur)
  location ^~ /admin-assets/ {
    rewrite ^/admin-assets/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3111;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }

  # Admin sayfalari (X-Forwarded-Proto http — internal rewrite 500 tuzagi)
  location ^~ /admin {
    proxy_pass http://127.0.0.1:3111;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }
  location ^~ /auth/ {
    proxy_pass http://127.0.0.1:3111;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }
  location ^~ /unauthorized {
    proxy_pass http://127.0.0.1:3111;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }

  # Frontend (kok) + frontend /_next  (X-Forwarded-Proto http — internal rewrite 500 tuzagi)
  location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # certbot SSL ekledikten sonra HSTS:
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
}
